<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Corn Labs, creator of Cozy Solitaire.">
  <title>Corn Labs — Cozy Solitaire</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 20px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #243b30;
      background: #f6f3eb;
    }

    main {
      width: 100%;
      max-width: 580px;
      padding: 36px;
      background: #fff;
      border: 1px solid #e3e7de;
      border-radius: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    h2 {
      margin-bottom: 8px;
    }

    a {
      color: #256342;
      text-underline-offset: 4px;
    }

    a:hover {
      color: #173e2a;
    }

    footer {
      margin-top: 32px;
      font-size: 0.9rem;
      color: #58675e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Corn Labs</h1>
    <p>Creator of Cozy Solitaire.</p>

    <h2>Cozy Solitaire</h2>
    <p>A cozy place to enjoy a game of solitaire.</p>

    <h2>Support</h2>
    <p>
      Questions or feedback?
      <a href="mailto:team.cornlabs@gmail.com">Contact us by email</a>.
    </p>

    <footer>
      <a href="https://corn-labs.github.io/privacy/">Privacy Policy</a>
    </footer>
  </main>
</body>
</html>
